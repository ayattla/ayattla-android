name: Site probe
on:
  push:
    branches: [site-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Status occasion pages
        shell: bash {0}
        run: |
          mkdir p; cd p
          curl -sSL -m 30 -A "Mozilla/5.0" https://ayattla.com/status/ -o status.html
          grep -o 'href="/status/[^"#?]*"' status.html | sort -u | tr '\n' ' '; echo
          for u in $(grep -o 'href="/status/[^"#?]*"' status.html | sed 's/href="//; s/"//' | sort -u); do
            n=$(echo $u | tr / _); curl -sSL -m 30 -A "Mozilla/5.0" "https://ayattla.com$u" -o "$n.html"; echo "$u $(wc -c < $n.html)"
          done
          ls
          f=$(ls _status_*jumu* _status_*friday* 2>/dev/null | head -1); [ -n "$f" ] || f=$(ls _status_*.html | head -1)
          echo "== SAMPLE $f"; python3 -c "
          import re,sys
          s=open('$f',encoding='utf-8').read()
          i=s.find('<main'); j=s.find('</main>')
          print(re.sub(r'\s+',' ',s[i:j])[:14000])
          "
          grep -o '/api/[a-z0-9/_-]*' status.html _status_*.html | sort -u | head -20
      - uses: actions/upload-artifact@v7
        with: { name: pages, path: p }
