# Builds the native Android app on GitHub's free runners (public repo).
# The Hostinger server keeps build.sh as the backup builder and holds the store signing key.
name: Android build

on:
  push:
    branches-ignore: [ci-shots]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.1'

      - name: Content pack and fonts (approved sources, verified)
        run: bash tools/prepare.sh

      - name: Version code (minutes since epoch, same scheme as the server)
        run: echo "AYT_VERSION_CODE=$(( $(date -u +%s) / 60 ))" >> "$GITHUB_ENV"

      - name: Signing key (only if the repository secrets exist)
        env:
          KS_B64: ${{ secrets.AYT_KS_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "AYT_KS=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          fi

      - name: Unit tests (prayer times, qibla, hijri, zakat match the site)
        run: gradle --no-daemon testDebugUnitTest

      - name: Lint (no API newer than minSdk)
        run: gradle --no-daemon lintDebug

      - name: Build bundle and APKs
        env:
          AYT_KS_PASS: ${{ secrets.AYT_KS_PASS }}
        run: gradle --no-daemon bundleRelease assembleRelease assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: ayattla-android-${{ github.run_number }}
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      # R8 mapping (to read crash reports from the minified build) and the content check report.
      - uses: actions/upload-artifact@v7
        with:
          name: mapping-and-reports-${{ github.run_number }}
          path: |
            app/build/outputs/mapping/release/mapping.txt
            build/content-report.md
          retention-days: 90
          if-no-files-found: warn

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports-${{ github.run_number }}
          path: app/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore

  screenshots:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: ayattla-android-${{ github.run_number }}
          path: out

      - name: Pick the debug APK
        run: |
          mkdir -p apk rel && cp out/apk/debug/*.apk apk/
          cp out/apk/release/*.apk rel/ 2>/dev/null || true
          ls apk rel

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Screens on an emulator (Pixel 6, Android 14)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            bash tools/shots.sh
            bash tools/crawl.sh

      - name: Publish screenshots to the ci-shots branch
        if: always()
        run: |
          test -d shots || exit 0
          cd shots
          git init -q && git checkout -q -b ci-shots
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add -A && git commit -q -m "screens from run ${{ github.run_number }} (${{ github.sha }})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-shots

  launch-matrix:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [26, 28, 30, 33, 35]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: ayattla-android-${{ github.run_number }}
          path: out
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Launch the release build on Android API ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.api >= 30 && 'google_apis' || 'default' }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/launch-test.sh
