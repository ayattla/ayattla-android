# Builds the Android app (Trusted Web Activity) on GitHub's free Linux runners.
# The Hostinger server keeps android/build.sh as the backup builder.
name: Android build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.9.1'

      - name: Version code (minutes since epoch, same scheme as the server)
        run: echo "AYT_VERSION_CODE=$(( $(date -u +%s) / 60 ))" >> "$GITHUB_ENV"

      - name: Signing key (only if the repository secrets exist)
        env:
          KS_B64: ${{ secrets.AYT_KS_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "AYT_KS=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "signed release build"
          else
            echo "no signing secrets: release bundle is unsigned, sign it on the server"
          fi

      - name: Build bundle and APKs
        env:
          AYT_KS_PASS: ${{ secrets.AYT_KS_PASS }}
        run: gradle --no-daemon bundleRelease assembleRelease assembleDebug

      - name: Check outputs
        run: |
          ls -la app/build/outputs/bundle/release app/build/outputs/apk/*/
          test -s app/build/outputs/bundle/release/*.aab

      - uses: actions/upload-artifact@v4
        with:
          name: ayattla-android-${{ github.run_number }}
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
