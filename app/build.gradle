plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ayattla.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.ayattla.app"
        minSdk 24
        targetSdk 36
        versionCode Integer.parseInt(System.getenv("AYT_VERSION_CODE") ?: "1")
        versionName System.getenv("AYT_VERSION_NAME") ?: "1.0.0"
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("AYT_KS") ?: "/root/.ayattla-android/upload.jks")
            storePassword System.getenv("AYT_KS_PASS")
            keyAlias "upload"
            keyPassword System.getenv("AYT_KS_PASS")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("AYT_KS_PASS")) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4'
}
